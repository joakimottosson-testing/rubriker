<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubrikgranskaren</title>

  <!-- Rubrikgranskaren: vitt R på röd botten. -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='11' fill='%23E60000'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Arial,sans-serif' font-size='49' font-weight='900' fill='white'%3ER%3C/text%3E%3C/svg%3E"
  >

  <style>
    /*
     * Rubrikgranskaren Beta 2.3
     *
     * Kalibrerade mått som inte bör ändras utan visuell kontroll mot sajten:
     * - Standardrubrik: 375 px
     * - Regular: 360 px
     * - Nedryck: 340 px (332 px effektiv textbredd)
     * - Rubrikmätning: 16 px säkerhetsmarginal
     */

    :root {
      --page-background: #fffec8;
      --alternative-background: #fff4b8;
      --field-background: #fff;
      --muted-text: #555;
      --focus-color: #005bd1;
      --headline-width: 375px;
      --regular-width: 360px;
      --deck-width: 340px;
    }

    @font-face {
      font-family: ABMonument;
      src: url('https://cdn.aftonbladet.se/fonts/ABMonumentGroteskHeadline/ABMonumentGroteskHeadline-Bold750.woff2') format('woff2');
      font-display: swap;
    }

    @font-face {
      font-family: ABMonumentRegular;
      src: url('https://cdn.aftonbladet.se/fonts/ABMonumentGrotesk/ABMonumentGrotesk-Regular.woff2') format('woff2');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-background);
      color: #000;
      font-family: ABMonument, sans-serif;
    }

    /* Sidhuvud och tvåspaltslayout. */
    .layout {
      display: grid;
      grid-template-columns: 383px var(--headline-width);
      gap: 24px 32px;
      align-items: start;
      max-width: 834px;
      margin: 24px auto;
      padding: 0 22px;
    }

    .sidebar {
      grid-column: 1 / -1;
      color: var(--muted-text);
      font-family: 'Courier New', monospace;
    }

    .sidebar .title {
      font-size: 32px;
      letter-spacing: .06em;
      line-height: 1.1;
    }

    .contact {
      margin-top: 4px;
      font-size: 12px;
      font-style: italic;
    }

    .contact a {
      color: var(--focus-color);
      text-decoration: none;
    }

    .contact .help-link {
      color: var(--muted-text);
    }

    /* Arkiv: dolt tills användaren öppnar det. */
    .archive-trigger { border:0; padding:0; background:none; color:var(--muted-text); font:inherit; cursor:pointer; }
    .archive-trigger:hover { text-decoration:underline; }
    .archive-panel { grid-column:1/-1; background:#fffdf0; border:0; padding:12px; font:13px Arial,sans-serif; max-height:320px; overflow:auto; }
    .archive-panel[hidden] { display:none; }
    .archive-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .archive-header-actions { display:flex; align-items:center; gap:10px; }
    .archive-search-toggle { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border:0; background:transparent; color:#888; cursor:pointer; padding:0; }
    .archive-search-toggle:hover { color:#555; }
    .archive-search-toggle:focus-visible { outline:2px solid var(--focus-color); outline-offset:2px; }
    .archive-search-toggle svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; }
    .archive-search-input { width:100%; padding:7px 2px; margin:0 0 9px; border:0; border-bottom:1px solid #d8d5bb; outline:0; background:transparent; color:#111; font:13px Arial,sans-serif; }
    .archive-search-input:focus { border-bottom-color:#777; }
    .archive-search-input[hidden] { display:none; }
    .archive-list { display:grid; gap:5px; }
    .archive-entry { width:100%; border:0; background:white; padding:9px 10px; text-align:left; cursor:pointer; color:#111; }
    .archive-entry:hover, .archive-entry:focus-visible { background:#fff4b8; }
    .archive-entry small { display:block; color:#777; margin-bottom:3px; }
    /* Arkivets rubriker behåller 17 px men får samma radfördelning som originalet.
       Bredden beräknas separat för varje sparad version i JavaScript. */
    .archive-entry strong {
      display: block;
      width: max-content;
      max-width: 100%;
      font-family: ABMonument, sans-serif;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.02em;
      line-height: 1.1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .archive-entry span { display:block; margin-top:3px; }
    /* Rubrik- och nedrycksfält. */
    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .format-group {
      min-width: 0;
    }

    .label {
      margin: 0 0 4px 2px;
      color: var(--muted-text);
      font: 13px Arial, sans-serif;
    }

    .box,
    .deck-box {
      background: var(--field-background);
      padding: 0 4px;
    }

    .box {
      width: var(--headline-width);
    }

    .box.regular-box {
      width: var(--regular-width);
    }

    .deck-box {
      width: var(--deck-width);
    }

    .box-gap {
      margin-bottom: 10px;
    }

    .deck-gap {
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      resize: none;
      border: 0;
      outline: 0;
      background: var(--field-background);
      color: #000;
      font-family: ABMonument, sans-serif;
      font-weight: 750;
      letter-spacing: -.02em;
      line-height: 1;
    }

    textarea.regular,
    textarea.large,
    textarea.xl {
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }

    textarea.regular {
      height: 88px;
      font-size: 44px;
    }

    textarea.large {
      font-size: 54px;
    }

    textarea.large[data-lines='2'] {
      height: 108px;
    }

    textarea.large[data-lines='3'] {
      height: 162px;
    }

    textarea.xl {
      font-size: 74px;
    }

    textarea.xl[data-lines='2'] {
      height: 148px;
    }

    textarea.xl[data-lines='3'] {
      height: 222px;
    }

    .decktext {
      height: 38.4px;
      font-family: ABMonumentRegular, sans-serif;
      font-size: 16px;
      line-height: 1.2;
    }

    .decktext::placeholder {
      color: #aaa;
      font-size: 14px;
      font-style: italic;
    }

    /* Gemensamma klickbara etiketter och små kontroller. */
    .clickable-heading {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .clickable-heading:focus-visible {
      outline: 2px solid var(--muted-text);
      outline-offset: 3px;
    }

    .preview-toggle:focus-visible {
      outline: 2px solid var(--muted-text);
      outline-offset: 3px;
    }

    .variant-button:focus-visible {
      outline: 2px solid var(--muted-text);
      outline-offset: 2px;
    }

    .copy-headline:focus-visible {
      outline: 2px solid var(--muted-text);
      outline-offset: 1px;
    }

    .format-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      width: var(--headline-width);
      max-width: 100%;
    }

    .variant-button {
      margin: -12px -11px -12px -6px;
      padding: 12px 14px 12px 6px;
      border: 0;
      background: transparent;
      color: var(--muted-text);
      cursor: pointer;
      font: 20px / 1 Arial, sans-serif;
    }

    .variant-button:hover {
      color: #000;
    }

    .copy-headline {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 30px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #999;
      cursor: pointer;
    }

    .copy-headline:hover {
      color: var(--muted-text);
    }

    .copy-headline.copied {
      color: #238a61;
    }

    .copy-headline svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linejoin: round;
    }

    /* Alternativa rubrikförslag. */
    .alternative-block {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 0;
      transition: grid-template-rows 130ms ease-out, margin-top 130ms ease-out;
    }

    .alternative-block.is-open {
      grid-template-rows: 1fr;
      margin-top: 14px;
    }

    .alternative-block-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      background: transparent;
      transition: visibility 0s linear 130ms;
    }

    .alternative-block.is-open .alternative-block-inner {
      visibility: visible;
      transition-delay: 0s;
    }

    .alternative-block-inner > .label {
      width: var(--headline-width);
      max-width: 100%;
      margin: 0 0 8px;
      padding: 6px 4px;
      background: var(--alternative-background);
      color: var(--muted-text);
    }

    .alternative-block-inner.regular-alternative > .label {
      width: var(--regular-width);
    }

    .alternative-block-inner .box,
    .alternative-block-inner .deck-box {
      max-width: 100%;
    }

    .alternative-copy-heading {
      display: flex;
      align-items: center;
    }

    /* Huvudpuffens förhandsvisning. */
    .preview-area {
      position: sticky;
      top: 24px;
      min-width: 0;
    }

    .preview-control {
      display: flex;
      align-items: center;
      /* Matcha Regular-etikettradens 30 px höjd för exakt topplinjering. */
      height: 30px;
      gap: 9px;
      margin: 0 0 4px 2px;
      color: var(--muted-text);
      font: 13px Arial, sans-serif;
    }

    .preview-status {
      min-width: 16px;
    }

    .preview-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 40px;
      height: 23px;
      padding: 3px;
      border: 0;
      border-radius: 999px;
      background: #a3a3a3;
      cursor: pointer;
      transition: background-color .15s ease;
    }

    .preview-toggle[aria-checked='true'] {
      justify-content: flex-end;
      background: #238a61;
    }

    .preview-toggle-knob {
      display: block;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #fff;
    }

    .preview {
      position: relative;
      width: var(--headline-width);
      max-width: 100%;
      overflow: hidden;
      background: var(--field-background);
    }

    .preview[hidden] {
      display: none;
    }

    .preview img {
      display: block;
      width: 100%;
      height: auto;
    }

    .preview img[hidden],
    .empty-image[hidden],
    .remove-image[hidden] {
      display: none;
    }

    .empty-image {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1500 / 549;
      padding: 12px;
      background: #eee;
      color: #aaa;
      cursor: pointer;
      font: 14px Arial, sans-serif;
      text-align: center;
    }

    .empty-image.drag {
      background: #fff2a3;
    }

    .remove-image {
      position: absolute;
      z-index: 2;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .78);
      color: #fff;
      cursor: pointer;
      font: 24px Arial, sans-serif;
    }

    .preview-copy {
      width: 100%;
      max-width: 100%;
      padding: 12px 4px 16px;
      background: var(--field-background);
      cursor: default;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .preview-title,
    .preview-deck {
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .preview-title {
      font-family: ABMonument, sans-serif;
      font-weight: 750;
      letter-spacing: -.02em;
      line-height: 1;
      white-space: pre-wrap;
      overflow-wrap: normal;
    }

    .preview-deck {
      /* 340 px box minus 4 px padding på vardera sidan. */
      width: 332px;
      max-width: 100%;
      margin-top: 10px;
      font-family: ABMonumentRegular, Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
      white-space: pre-wrap;
      overflow-wrap: normal;
    }

    /* Sidopuff: två tredjedelar text, en tredjedel bild. */
    .side-preview-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted-text);
      font: 13px Arial, sans-serif;
    }

    .side-preview-toggle-row[hidden],
    .side-preview[hidden],
    .side-crop-controls[hidden] {
      display: none;
    }

    .side-preview {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      width: var(--headline-width);
      max-width: 100%;
      margin-top: 14px;
      overflow: visible;
      background: var(--field-background);
    }

    .side-copy {
      min-width: 0;
      padding: 10px 6px;
    }

    .side-title,
    .side-deck {
      cursor: default;
      pointer-events: none;
      user-select: none;
    }

    .side-title {
      font-family: ABMonument, sans-serif;
      font-weight: 750;
      letter-spacing: -.02em;
      line-height: 1;
      white-space: pre-wrap;
      overflow-wrap: normal;
    }

    .side-deck {
      margin-top: 8px;
      font-family: ABMonumentRegular, Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .side-image-wrap {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 115px;
    }

    .side-image-area {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 115px;
      overflow: hidden;
      background: #eee;
    }

    .side-image-area img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1);
      transform-origin: center;
    }

    .side-image-area img[hidden],
    .side-image-placeholder[hidden] {
      display: none;
    }

    .side-image-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font: 12px Arial, sans-serif;
      text-align: center;
    }

    /* Vertikalt zoomreglage, placerat utanför bildytan. */
    .side-zoom-rail {
      position: absolute;
      top: 0;
      right: -30px;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      background: var(--page-background);
    }

    .side-zoom-icon {
      position: absolute;
      top: -30px;
      left: 5px;
      width: 16px;
      height: 16px;
      color: #aaa;
      pointer-events: none;
    }

    .side-zoom-rail input[type='range'] {
      width: 26px;
      height: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      direction: rtl;
      writing-mode: vertical-lr;
    }

    .side-zoom-rail input[type='range']::-webkit-slider-runnable-track {
      width: 5px;
      height: 100%;
      border-radius: 5px;
      background: #d2d2c5;
    }

    .side-zoom-rail input[type='range']::-webkit-slider-thumb {
      width: 24px;
      height: 16px;
      margin-top: 0;
      margin-left: -9.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 5px;
      background: #eeeeea;
    }

    .side-zoom-rail input[type='range']::-moz-range-track {
      width: 5px;
      height: 100%;
      border-radius: 5px;
      background: #d2d2c5;
    }

    .side-zoom-rail input[type='range']::-moz-range-thumb {
      width: 24px;
      height: 16px;
      border: 0;
      border-radius: 5px;
      background: #eeeeea;
    }

    .side-zoom-rail input[type='range']:focus-visible {
      outline: 2px solid var(--focus-color);
    }

    .side-crop-controls input[type='range']:focus-visible {
      outline: 2px solid var(--focus-color);
      outline-offset: 2px;
    }

    /* Horisontellt reglage för bildutsnitt. */
    .side-crop-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      background: var(--page-background);
      color: var(--muted-text);
      font: 12px Arial, sans-serif;
    }

    .side-crop-controls input[type='range'] {
      flex: 1;
      min-width: 0;
      height: 38px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    .side-crop-controls input[type='range']::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 5px;
      background: #d2d2c5;
    }

    .side-crop-controls input[type='range']::-webkit-slider-thumb {
      width: 16px;
      height: 26px;
      margin-top: -10.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 5px;
      background: #eeeeea;
    }

    .side-crop-controls input[type='range']::-moz-range-track {
      height: 5px;
      border-radius: 5px;
      background: #d2d2c5;
    }

    .side-crop-controls input[type='range']::-moz-range-thumb {
      width: 16px;
      height: 26px;
      border: 0;
      border-radius: 5px;
      background: #eeeeea;
    }

    @media (prefers-reduced-motion: reduce) {
      .alternative-block,
      .alternative-block-inner {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="title">RUBRIKGRANSKARE</div>
      <div class="contact">
        Beta 2.3 · <button type="button" class="archive-trigger" id="archive-toggle" aria-expanded="false" aria-controls="archive-panel">Arkiv</button> ·
        <a
          class="help-link"
          href="https://drive.google.com/file/d/1SWDvGUG_xaz2xifz8poDpf90jYG_v-7D/view"
          target="_blank"
          rel="noopener noreferrer"
          title="Se demonstrationsvideon i en ny flik"
        >Nya funktioner</a>
        · Contact:
        <a href="mailto:joakim.ottosson@schibsted.com">Joakim Ottosson</a>
      </div>
    </aside>

    <section class="archive-panel" id="archive-panel" hidden aria-label="Rubrikarkiv">
      <div class="archive-header">
        <strong>Senaste 24 timmarna</strong>
        <div class="archive-header-actions">
          <span id="archive-count"></span>
          <button type="button" class="archive-search-toggle" id="archive-search-toggle" aria-label="Sök i arkivet" aria-expanded="false" aria-controls="archive-search" title="Sök rubrik">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
          </button>
        </div>
      </div>
      <input id="archive-search" class="archive-search-input" type="search" placeholder="Sök rubrik…" aria-label="Sök bland sparade rubriker" autocomplete="off" hidden>
      <div class="archive-list" id="archive-list"></div>
    </section>

    <main class="wrapper">
      <div class="format-group">
        <div class="label">Regular · 2 rader</div>
        <div class="box regular-box box-gap">
          <textarea class="regular" id="regular-2"></textarea>
        </div>
        <div class="deck-box">
          <textarea class="decktext" id="deck-1" placeholder="nedryck"></textarea>
        </div>
      </div>

      <div class="format-group">
        <div class="label">Large · 2 rader</div>
        <div class="box">
          <textarea class="large" data-lines="2" id="large-2"></textarea>
        </div>
        <div class="deck-box deck-gap">
          <textarea class="decktext" id="deck-2" placeholder="nedryck"></textarea>
        </div>
      </div>

      <div class="format-group">
        <div class="label">Large · 3 rader</div>
        <div class="box">
          <textarea class="large" data-lines="3" id="large-3"></textarea>
        </div>
        <div class="deck-box deck-gap">
          <textarea class="decktext" id="deck-3" placeholder="nedryck"></textarea>
        </div>
      </div>

      <div class="format-group">
        <div class="label">XL · 2 rader</div>
        <div class="box">
          <textarea class="xl" data-lines="2" id="xl-2"></textarea>
        </div>
        <div class="deck-box deck-gap">
          <textarea class="decktext" id="deck-4" placeholder="nedryck"></textarea>
        </div>
      </div>

      <div class="format-group">
        <div class="label">XL · 3 rader</div>
        <div class="box">
          <textarea class="xl" data-lines="3" id="xl-3"></textarea>
        </div>
        <div class="deck-box deck-gap">
          <textarea class="decktext" id="deck-5" placeholder="nedryck"></textarea>
        </div>
      </div>
    </main>

    <section class="preview-area" id="preview-area">
      <div class="preview-control">
        <button
          type="button"
          class="clickable-heading"
          id="preview-label"
          aria-controls="preview"
          title="Slå på eller av förhandsvisning"
        >Puff · Förhandsvisning</button>
        <span class="preview-status" id="preview-status" aria-hidden="true">Av</span>
        <button
          type="button"
          class="preview-toggle"
          id="toggle-preview"
          role="switch"
          aria-label="Förhandsvisning"
          aria-checked="false"
          aria-controls="preview"
          title="Slå på eller av förhandsvisning"
        >
          <span class="preview-toggle-knob" aria-hidden="true"></span>
        </button>
      </div>

      <div class="preview" id="preview" hidden>
        <button
          type="button"
          class="remove-image"
          id="remove-image"
          aria-label="Ta bort bilden"
          title="Ta bort bilden"
          hidden
        >×</button>
        <label class="empty-image" for="image-file" id="empty-image">
          Klicka eller dra in bild
        </label>
        <input type="file" id="image-file" accept="image/*" hidden>
        <img id="preview-image" alt="Vald puffbild" hidden>
        <div class="preview-copy">
          <div class="preview-title" id="preview-title"></div>
          <div class="preview-deck" id="preview-deck"></div>
        </div>
      </div>

      <div class="side-preview-toggle-row" id="side-preview-toggle-row" hidden>
        <button
          type="button"
          class="clickable-heading"
          id="side-preview-label"
          aria-controls="side-preview"
          title="Visa eller dölj sidopuff"
        >Sidopuff</button>
        <button
          type="button"
          class="variant-button"
          id="toggle-side-preview"
          aria-expanded="false"
          aria-controls="side-preview"
          aria-label="Visa sidopuff"
          title="Visa sidopuff"
        >+</button>
      </div>

      <div
        class="side-preview"
        id="side-preview"
        aria-label="Sidopuff med bild till höger"
        hidden
      >
        <div class="side-copy">
          <div class="side-title" id="side-title"></div>
          <div class="side-deck" id="side-deck"></div>
        </div>
        <div class="side-image-wrap">
          <div class="side-image-area">
            <div class="side-image-placeholder" id="side-image-placeholder">Bildutsnitt</div>
            <img id="side-image" alt="Beskuret utsnitt av vald bild" hidden>
          </div>
          <div class="side-zoom-rail" title="Zooma sidopuffens bild">
            <svg
              class="side-zoom-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="10.8" cy="10.8" r="6.5"></circle>
              <path d="m16 16 5 5M10.8 7.8v6M7.8 10.8h6"></path>
            </svg>
            <input
              type="range"
              id="side-zoom-slider"
              min="100"
              max="200"
              step="1"
              value="100"
              aria-label="Zooma sidopuffens bild, från 100 till 200 procent"
            >
          </div>
        </div>
      </div>

      <div class="side-crop-controls" id="side-crop-controls" hidden>
        <label for="side-crop-slider">Bildutsnitt</label>
        <input
          type="range"
          id="side-crop-slider"
          min="0"
          max="100"
          step="1"
          value="50"
          aria-label="Bildutsnitt, vänster till höger"
          aria-valuetext="Mitten"
        >
      </div>
    </section>
  </div>

  <script>
    'use strict';

    /*
     * Kodstruktur
     * 1. Konfiguration och tillstånd
     * 2. Alternativa rubriker och kopiering
     * 3. Rubrikmätning och inklistring
     * 4. Förhandsvisningar
     * 5. Bildhantering
     * 6. Initiering
     */

    // -------------------------------------------------------------------------
    // 1. Konfiguration och tillstånd
    // -------------------------------------------------------------------------

    const BASE_FORMATS = [
      { id: 'regular-2', deckId: 'deck-1', maxSize: 44 },
      { id: 'large-2', deckId: 'deck-2', maxSize: 54 },
      { id: 'large-3', deckId: 'deck-3', maxSize: 54 },
      { id: 'xl-2', deckId: 'deck-4', maxSize: 74 },
      { id: 'xl-3', deckId: 'deck-5', maxSize: 74 }
    ];

    const HEADLINE_MIN_SIZE = 16;
    const HEADLINE_MEASUREMENT_MARGIN = 16;
    const SIDE_TITLE_MIN_SIZE = 8;
    const SIDE_TITLE_MAX_SIZE = 54;
    const DEFAULT_ACTIVE_SOURCE = 'large-2';

    const COPY_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="12" height="12" rx="1.5"></rect>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
      </svg>
    `;

    const CHECK_ICON = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 12 5 5L20 6"></path>
      </svg>
    `;

    const byId = id => document.getElementById(id);

    const elements = {
      preview: byId('preview'),
      previewLabel: byId('preview-label'),
      previewStatus: byId('preview-status'),
      previewToggle: byId('toggle-preview'),
      previewTitle: byId('preview-title'),
      previewDeck: byId('preview-deck'),
      previewImage: byId('preview-image'),
      emptyImage: byId('empty-image'),
      imageFile: byId('image-file'),
      removeImage: byId('remove-image'),
      previewArea: byId('preview-area'),
      sidePreview: byId('side-preview'),
      sidePreviewLabel: byId('side-preview-label'),
      sideToggleRow: byId('side-preview-toggle-row'),
      sideToggle: byId('toggle-side-preview'),
      sideTitle: byId('side-title'),
      sideDeck: byId('side-deck'),
      sideImage: byId('side-image'),
      sideImagePlaceholder: byId('side-image-placeholder'),
      sideCropControls: byId('side-crop-controls'),
      sideCropSlider: byId('side-crop-slider'),
      sideZoomSlider: byId('side-zoom-slider')
    };

    const headlineRecords = new Map();
    let activeSourceId = DEFAULT_ACTIVE_SOURCE;
    let sideExpanded = false;
    let imageObjectUrl = null;

    const headlineMirror = createMeasurementElement();
    const sideTitleMirror = createMeasurementElement();

    function createMeasurementElement() {
      const element = document.createElement('div');
      element.setAttribute('aria-hidden', 'true');
      Object.assign(element.style, {
        position: 'absolute',
        top: '0',
        left: '-10000px',
        margin: '0',
        padding: '0',
        visibility: 'hidden',
        pointerEvents: 'none',
        whiteSpace: 'pre-wrap',
        overflowWrap: 'normal',
        wordBreak: 'normal'
      });
      document.body.appendChild(element);
      return element;
    }

    // -------------------------------------------------------------------------
    // 2. Alternativa rubriker och kopiering
    // -------------------------------------------------------------------------

    function registerHeadline(field, deck, maxSize) {
      headlineRecords.set(field.id, { field, deck, maxSize });
    }

    function createCopyButton(field, description) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-headline';
      button.title = 'Kopiera rubrik';
      button.setAttribute('aria-label', `Kopiera ${description}`);
      button.innerHTML = COPY_ICON;

      // Förhindra att mousedown flyttar markören från rubrikfältet.
      button.addEventListener('pointerdown', event => event.preventDefault());

      let feedbackTimer;
      button.addEventListener('click', async () => {
        if (!field.value) return;

        try {
          await copyText(field.value, field);
          button.classList.add('copied');
          button.innerHTML = CHECK_ICON;
          button.title = 'Kopierat!';

          clearTimeout(feedbackTimer);
          feedbackTimer = setTimeout(() => {
            button.classList.remove('copied');
            button.innerHTML = COPY_ICON;
            button.title = 'Kopiera rubrik';
          }, 1100);
        } catch (error) {
          button.title = 'Kunde inte kopiera';
          console.warn('Kopiering misslyckades:', error);
        }
      });

      return button;
    }

    async function copyText(value, sourceField) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }

      // Reserv för lokala HTML-filer och webbläsare utan Clipboard API.
      const helper = document.createElement('textarea');
      helper.value = value;
      helper.style.cssText = 'position:fixed;left:-9999px;top:0';

      const previousFocus = document.activeElement;
      const selectionStart = sourceField.selectionStart;
      const selectionEnd = sourceField.selectionEnd;

      document.body.appendChild(helper);
      helper.select();
      const copied = document.execCommand('copy');
      helper.remove();

      if (previousFocus && typeof previousFocus.focus === 'function') {
        previousFocus.focus({ preventScroll: true });
      }
      if (previousFocus === sourceField) {
        sourceField.setSelectionRange(selectionStart, selectionEnd);
      }
      if (!copied) {
        throw new Error('Kopiering misslyckades');
      }
    }

    function buildFormat(format) {
      const originalField = byId(format.id);
      const originalDeck = byId(format.deckId);
      const group = originalField.closest('.format-group');
      const heading = group.querySelector('.label');
      const headingText = heading.textContent.trim();

      const alternativeId = `${format.id}-alt`;
      const alternativeDeckId = `${format.deckId}-alt`;

      const headingButton = document.createElement('button');
      headingButton.type = 'button';
      headingButton.className = 'clickable-heading';
      headingButton.textContent = headingText;
      headingButton.title = 'Visa eller dölj alternativ';

      const toggleButton = document.createElement('button');
      toggleButton.type = 'button';
      toggleButton.className = 'variant-button';
      toggleButton.textContent = '+';
      toggleButton.title = 'Visa ett extra rubrikförslag';
      toggleButton.setAttribute('aria-label', `Visa alternativ för ${headingText}`);
      toggleButton.setAttribute('aria-expanded', 'false');
      toggleButton.setAttribute('aria-controls', `${alternativeId}-section`);

      heading.classList.add('format-heading');
      heading.replaceChildren(
        headingButton,
        toggleButton,
        createCopyButton(originalField, headingText)
      );

      headingButton.addEventListener('click', () => toggleButton.click());

      const section = document.createElement('div');
      section.className = 'alternative-block';
      section.id = `${alternativeId}-section`;
      section.setAttribute('aria-hidden', 'true');
      section.inert = true;

      const sectionInner = document.createElement('div');
      sectionInner.className = 'alternative-block-inner';
      if (originalField.classList.contains('regular')) {
        sectionInner.classList.add('regular-alternative');
      }

      const alternativeField = originalField.cloneNode(false);
      alternativeField.id = alternativeId;
      alternativeField.value = '';
      alternativeField.removeAttribute('title');

      const alternativeDeck = originalDeck.cloneNode(false);
      alternativeDeck.id = alternativeDeckId;
      alternativeDeck.value = '';

      const alternativeLabel = document.createElement('div');
      alternativeLabel.className = 'label alternative-copy-heading';
      alternativeLabel.append(
        document.createTextNode('Alternativ'),
        createCopyButton(alternativeField, `${headingText} alternativ`)
      );

      const headlineBox = originalField.parentElement.cloneNode(false);
      headlineBox.appendChild(alternativeField);

      const deckBox = originalDeck.parentElement.cloneNode(false);
      deckBox.appendChild(alternativeDeck);

      sectionInner.append(alternativeLabel, headlineBox, deckBox);
      section.appendChild(sectionInner);
      group.appendChild(section);

      registerHeadline(originalField, originalDeck, format.maxSize);
      registerHeadline(alternativeField, alternativeDeck, format.maxSize);

      toggleButton.addEventListener('click', () => {
        const opening = !section.classList.contains('is-open');

        if (!opening && activeSourceId === alternativeId) {
          originalField.focus();
        }

        section.classList.toggle('is-open', opening);
        section.inert = !opening;
        section.setAttribute('aria-hidden', String(!opening));
        toggleButton.textContent = opening ? '−' : '+';
        toggleButton.title = opening
          ? 'Fäll ihop alternativet'
          : 'Visa ett extra rubrikförslag';
        toggleButton.setAttribute('aria-expanded', String(opening));
        toggleButton.setAttribute(
          'aria-label',
          `${opening ? 'Dölj' : 'Visa'} alternativ för ${headingText}`
        );

        if (opening) {
          fitHeadline(alternativeField, format.maxSize);
          alternativeField.focus();
        }
      });
    }

    // -------------------------------------------------------------------------
    // 3. Rubrikmätning, storleksanpassning och inklistring
    // -------------------------------------------------------------------------

    function measureHeadlineLines(field, fontSize) {
      const style = getComputedStyle(field);

      Object.assign(headlineMirror.style, {
        width: `${Math.max(1, field.clientWidth - HEADLINE_MEASUREMENT_MARGIN)}px`,
        fontFamily: style.fontFamily,
        fontWeight: style.fontWeight,
        fontStyle: style.fontStyle,
        fontSize: `${fontSize}px`,
        lineHeight: style.lineHeight === 'normal' ? 'normal' : `${fontSize}px`,
        letterSpacing: style.letterSpacing,
        textTransform: style.textTransform
      });

      // Nollbreddstecknet gör att en avslutande radbrytning räknas.
      headlineMirror.textContent = `${field.value || ''}\u200b`;
      const height = headlineMirror.getBoundingClientRect().height;
      return Math.max(1, Math.ceil((height - .5) / fontSize));
    }

    function fitHeadline(field, maxSize, precision = .25) {
      const allowedLines = Number(field.dataset.lines) || 2;
      if (!field.clientWidth) return;

      if (measureHeadlineLines(field, maxSize) <= allowedLines) {
        field.style.fontSize = `${maxSize}px`;
        field.title = '';
        return;
      }

      let lower = HEADLINE_MIN_SIZE;
      let upper = maxSize;

      while (upper - lower > precision) {
        const middle = (lower + upper) / 2;
        if (measureHeadlineLines(field, middle) <= allowedLines) {
          lower = middle;
        } else {
          upper = middle;
        }
      }

      field.style.fontSize = `${Math.max(HEADLINE_MIN_SIZE, lower - .5)}px`;
      field.title = measureHeadlineLines(field, lower) > allowedLines
        ? `Texten är för lång för ${allowedLines} rader`
        : '';
    }

    function normalizePastedText(clipboardText, field) {
      const normalized = clipboardText
        .replace(/[\u200B\u2060\uFEFF]/g, '')
        .replace(/\s+/gu, ' ')
        .trim();

      const start = field.selectionStart;
      const end = field.selectionEnd;
      const before = field.value.slice(0, start);
      const after = field.value.slice(end);
      const prefix = /^\s/.test(clipboardText) && before && !/\s$/.test(before) ? ' ' : '';
      const suffix = /\s$/.test(clipboardText) && after && !/^\s/.test(after) ? ' ' : '';

      return {
        text: `${prefix}${normalized}${suffix}`,
        start,
        end
      };
    }

    function handleHeadlinePaste(event, record) {
      const clipboardText = event.clipboardData?.getData('text/plain');
      if (!clipboardText) return;

      event.preventDefault();
      const { text, start, end } = normalizePastedText(clipboardText, record.field);

      // insertText behåller normalt Chromes ångrahistorik. Reservmetoden
      // fungerar även om det äldre API:t skulle saknas.
      const inserted = document.execCommand('insertText', false, text);
      if (!inserted) {
        record.field.setRangeText(text, start, end, 'end');
        record.field.dispatchEvent(new Event('input', { bubbles: true }));
      }

      requestAnimationFrame(() => {
        fitHeadline(record.field, record.maxSize);
        if (activeSourceId === record.field.id) {
          updatePreview();
        }
      });
    }

    function bindRecord(record) {
      const { field, deck, maxSize } = record;

      field.addEventListener('focus', () => {
        activeSourceId = field.id;
        updatePreview();
      });

      field.addEventListener('input', () => {
        activeSourceId = field.id;
        fitHeadline(field, maxSize);
        requestAnimationFrame(updatePreview);
      });

      field.addEventListener('paste', event => handleHeadlinePaste(event, record));

      deck.addEventListener('focus', () => {
        activeSourceId = field.id;
        updatePreview();
      });

      deck.addEventListener('input', updatePreview);

      fitHeadline(field, maxSize);
    }

    function recalculateAllHeadlines() {
      headlineRecords.forEach(record => {
        fitHeadline(record.field, record.maxSize);
      });
    }

    // -------------------------------------------------------------------------
    // 4. Förhandsvisningar
    // -------------------------------------------------------------------------

    function syncSidePreviewVisibility() {
      const shouldShow = !elements.preview.hidden && sideExpanded;
      elements.sidePreview.hidden = !shouldShow;
      elements.sideCropControls.hidden = !shouldShow;

      if (shouldShow) {
        requestAnimationFrame(updatePreview);
      }
    }

    function toggleMainPreview() {
      const shouldShow = elements.preview.hidden;
      elements.preview.hidden = !shouldShow;
      elements.sideToggleRow.hidden = !shouldShow;
      elements.previewToggle.setAttribute('aria-checked', String(shouldShow));
      elements.previewStatus.textContent = shouldShow ? 'På' : 'Av';
      syncSidePreviewVisibility();

      if (shouldShow) {
        requestAnimationFrame(updatePreview);
      }
    }

    function toggleSidePreview() {
      sideExpanded = !sideExpanded;
      elements.sideToggle.textContent = sideExpanded ? '−' : '+';
      elements.sideToggle.title = sideExpanded ? 'Dölj sidopuff' : 'Visa sidopuff';
      elements.sideToggle.setAttribute('aria-expanded', String(sideExpanded));
      elements.sideToggle.setAttribute(
        'aria-label',
        sideExpanded ? 'Dölj sidopuff' : 'Visa sidopuff'
      );
      syncSidePreviewVisibility();
    }

    function fitSideTitle() {
      if (elements.sidePreview.hidden || !elements.sideTitle.getBoundingClientRect().width) {
        return;
      }

      const style = getComputedStyle(elements.sideTitle);
      const width = elements.sideTitle.getBoundingClientRect().width;

      Object.assign(sideTitleMirror.style, {
        width: `${Math.max(1, width - 1)}px`,
        boxSizing: 'border-box',
        fontFamily: style.fontFamily,
        fontWeight: style.fontWeight,
        fontStyle: style.fontStyle,
        letterSpacing: style.letterSpacing,
        textTransform: style.textTransform,
        whiteSpace: 'pre-wrap',
        overflowWrap: 'anywhere',
        wordBreak: 'normal'
      });
      sideTitleMirror.textContent = `${elements.sideTitle.textContent || ''}\u200b`;

      const fits = size => {
        sideTitleMirror.style.fontSize = `${size}px`;
        sideTitleMirror.style.lineHeight = `${size}px`;
        const height = sideTitleMirror.getBoundingClientRect().height;
        return height <= size * 2 + .5
          && sideTitleMirror.scrollWidth <= sideTitleMirror.clientWidth + 1;
      };

      let lower = SIDE_TITLE_MIN_SIZE;
      let upper = SIDE_TITLE_MAX_SIZE;

      if (fits(SIDE_TITLE_MAX_SIZE)) {
        lower = SIDE_TITLE_MAX_SIZE;
      } else if (fits(SIDE_TITLE_MIN_SIZE)) {
        for (let iteration = 0; iteration < 16; iteration += 1) {
          const middle = (lower + upper) / 2;
          if (fits(middle)) {
            lower = middle;
          } else {
            upper = middle;
          }
        }
      }

      elements.sideTitle.style.overflowWrap = 'anywhere';
      let size = Math.max(SIDE_TITLE_MIN_SIZE, lower - .25);

      const renderedTitleFits = () => {
        const rect = elements.sideTitle.getBoundingClientRect();
        return rect.height <= size * 2 + 1
          && elements.sideTitle.scrollWidth <= elements.sideTitle.clientWidth + 1;
      };

      elements.sideTitle.style.fontSize = `${size}px`;
      while (!renderedTitleFits() && size > SIDE_TITLE_MIN_SIZE) {
        size = Math.max(SIDE_TITLE_MIN_SIZE, size - .25);
        elements.sideTitle.style.fontSize = `${size}px`;
      }

      elements.sideTitle.title = renderedTitleFits()
        ? ''
        : 'Texten är för lång för två rader';
    }

    function updatePreview() {
      const record = headlineRecords.get(activeSourceId);
      if (!record) return;

      const { field, deck } = record;
      elements.previewTitle.textContent = field.value;
      elements.previewDeck.textContent = deck.value;
      elements.sideTitle.textContent = field.value;
      elements.sideDeck.textContent = deck.value;

      // Huvudpuffen använder exakt samma bredd och typografi som källfältet.
      const previewWidth = field.parentElement.getBoundingClientRect().width;
      const sourceStyle = getComputedStyle(field);

      elements.preview.style.width = `${previewWidth}px`;
      elements.sidePreview.style.width = `${previewWidth}px`;
      Object.assign(elements.previewTitle.style, {
        fontSize: sourceStyle.fontSize,
        fontFamily: sourceStyle.fontFamily,
        fontWeight: sourceStyle.fontWeight,
        letterSpacing: sourceStyle.letterSpacing,
        lineHeight: sourceStyle.lineHeight
      });

      fitSideTitle();
    }

    // -------------------------------------------------------------------------
    // 5. Bildhantering
    // -------------------------------------------------------------------------

    function updateCropPosition() {
      const value = Number(elements.sideCropSlider.value);
      elements.sideImage.style.objectPosition = `${value}% center`;

      const valueText = value === 0
        ? 'Vänster'
        : value === 50
          ? 'Mitten'
          : value === 100
            ? 'Höger'
            : `${value} procent`;
      elements.sideCropSlider.setAttribute('aria-valuetext', valueText);
    }

    function updateZoom() {
      const zoom = Number(elements.sideZoomSlider.value) / 100;
      elements.sideImage.style.transform = `scale(${zoom})`;
      elements.sideZoomSlider.setAttribute(
        'aria-valuetext',
        `${elements.sideZoomSlider.value} procent`
      );
    }

    function setImageVisibility(hasImage) {
      elements.previewImage.hidden = !hasImage;
      elements.sideImage.hidden = !hasImage;
      elements.emptyImage.hidden = hasImage;
      elements.sideImagePlaceholder.hidden = hasImage;
      elements.removeImage.hidden = !hasImage;
    }

    function removeImage() {
      if (imageObjectUrl) {
        URL.revokeObjectURL(imageObjectUrl);
      }
      imageObjectUrl = null;
      elements.previewImage.removeAttribute('src');
      elements.sideImage.removeAttribute('src');
      elements.imageFile.value = '';
      setImageVisibility(false);
    }

    function loadImage(file) {
      if (!file || !file.type.startsWith('image/')) return;

      if (imageObjectUrl) {
        URL.revokeObjectURL(imageObjectUrl);
      }
      imageObjectUrl = URL.createObjectURL(file);

      elements.previewImage.onload = () => setImageVisibility(true);
      elements.previewImage.onerror = () => setImageVisibility(false);
      elements.sideImage.src = imageObjectUrl;
      elements.previewImage.src = imageObjectUrl;
    }

    function findImageFile(fileList) {
      return Array.from(fileList || []).find(file => file.type.startsWith('image/'));
    }

    function bindImageEvents() {
      elements.removeImage.addEventListener('click', removeImage);
      elements.imageFile.addEventListener('change', () => {
        loadImage(elements.imageFile.files[0]);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        elements.previewArea.addEventListener(eventName, event => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'copy';
          elements.emptyImage.classList.add('drag');
        });
      });

      elements.previewArea.addEventListener('dragleave', event => {
        if (!elements.previewArea.contains(event.relatedTarget)) {
          elements.emptyImage.classList.remove('drag');
        }
      });

      elements.previewArea.addEventListener('drop', event => {
        event.preventDefault();
        elements.emptyImage.classList.remove('drag');
        loadImage(findImageFile(event.dataTransfer.files));
      });

      // Hindra Chrome från att öppna en släppt bild som en ny sida.
      window.addEventListener('dragover', event => event.preventDefault());
      window.addEventListener('drop', event => event.preventDefault());

      document.addEventListener('paste', event => {
        loadImage(findImageFile(event.clipboardData?.files));
      });

      elements.sideCropSlider.addEventListener('input', updateCropPosition);
      elements.sideZoomSlider.addEventListener('input', updateZoom);
    }

    // -------------------------------------------------------------------------
    // 6. Lokalt rubrikarkiv: 5 sekunders paus, rullande 24 timmar
    // -------------------------------------------------------------------------
    const ARCHIVE_KEY = 'rubrikgranskaren.archive.v1';
    const ARCHIVE_DELAY = 5000;
    const ARCHIVE_MAX_AGE = 24 * 60 * 60 * 1000;
    const ARCHIVE_MAX_ITEMS = 1000;
    const ARCHIVE_VISIBLE_ITEMS = 100; // Visa högst 100 åt gången; sök i alla 1000.
    const archivePanel = byId('archive-panel');
    const archiveList = byId('archive-list');
    const archiveCount = byId('archive-count');
    const archiveToggle = byId('archive-toggle');
    const archiveSearchToggle = byId('archive-search-toggle');
    const archiveSearch = byId('archive-search');
    const archiveTimers = new Map();
    let archiveEntries = readArchive();

    function readArchive() {
      try {
        const value = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]');
        return Array.isArray(value) ? value.filter(item => item && typeof item.id === 'string' && typeof item.headline === 'string' && typeof item.deck === 'string' && Number.isFinite(item.savedAt)) : [];
      } catch (error) {
        console.warn('Arkivet kunde inte läsas:', error);
        return [];
      }
    }

    function pruneArchive() {
      const cutoff = Date.now() - ARCHIVE_MAX_AGE;
      archiveEntries = archiveEntries.filter(item => item.savedAt >= cutoff && headlineRecords.has(item.id))
        .sort((a, b) => b.savedAt - a.savedAt).slice(0, ARCHIVE_MAX_ITEMS);
    }

    function persistArchive() {
      pruneArchive();
      try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archiveEntries)); }
      catch (error) { console.warn('Arkivet kunde inte sparas:', error); }
      if (!archivePanel.hidden) renderArchive();
    }

    function saveArchiveVersion(id) {
      const record = headlineRecords.get(id);
      if (!record) return;
      const headline = record.field.value;
      const deck = record.deck.value;
      if (!headline.trim() && !deck.trim()) return;
      // Undvik identiska på varandra följande versioner av samma fält.
      const latest = archiveEntries.find(item => item.id === id);
      if (latest && latest.headline === headline && latest.deck === deck) return;
      archiveEntries.unshift({ id, headline, deck, savedAt: Date.now() });
      persistArchive();
    }

    function scheduleArchiveSave(id) {
      clearTimeout(archiveTimers.get(id));
      archiveTimers.set(id, setTimeout(() => {
        archiveTimers.delete(id);
        saveArchiveVersion(id);
      }, ARCHIVE_DELAY));
    }

    function restoreArchiveVersion(item) {
      const record = headlineRecords.get(item.id);
      if (!record) return;
      clearTimeout(archiveTimers.get(item.id));
      // Bevara aktuell version före återställning om den skiljer sig.
      saveArchiveVersion(item.id);
      record.field.value = item.headline;
      record.deck.value = item.deck;
      fitHeadline(record.field, record.maxSize);
      // Öppna alternativfältet om den sparade rubriken hör dit.
      if (item.id.endsWith('-alt')) {
        const section = byId(`${item.id}-section`);
        if (section && !section.classList.contains('is-open')) {
          const button = document.querySelector(`[aria-controls="${item.id}-section"]`);
          if (button) button.click();
        }
      }
      activeSourceId = item.id;
      record.field.focus();
      updatePreview();
      scheduleArchiveSave(item.id);
      archivePanel.hidden = true;
      archiveToggle.setAttribute('aria-expanded', 'false');
    }

    // Beräkna en proportionellt nedskalad radbredd för arkivets rubrik.
    // En dold kopia av originalfältet används så att den aktuella rubriken
    // i redigeraren aldrig ändras. Arkivtexten förblir 17 px stor.
    function archiveHeadlineWidth(item) {
      const record = headlineRecords.get(item.id);
      if (!record) return null;
      const source = record.field;
      const probe = source.cloneNode(false);
      probe.removeAttribute('id');
      probe.value = item.headline;
      Object.assign(probe.style, {
        position: 'absolute',
        left: '-10000px',
        top: '0',
        visibility: 'hidden',
        width: `${source.parentElement.getBoundingClientRect().width - 8}px`
      });
      document.body.appendChild(probe);
      fitHeadline(probe, record.maxSize);
      const fittedSize = parseFloat(getComputedStyle(probe).fontSize);
      const sourceWidth = probe.clientWidth;
      probe.remove();
      if (!fittedSize || !sourceWidth) return null;
      return Math.max(1, (sourceWidth - HEADLINE_MEASUREMENT_MARGIN) * 17 / fittedSize);
    }

    function renderArchive() {
      pruneArchive();
      archiveList.replaceChildren();
      archiveCount.textContent = `${archiveEntries.length} versioner`;
      if (!archiveEntries.length) {
        const empty = document.createElement('span');
        empty.textContent = 'Inga sparade rubriker ännu.';
        archiveList.appendChild(empty);
        return;
      }
      const formatter = new Intl.DateTimeFormat('sv-SE', { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' });
      const query = archiveSearch.value.trim().toLocaleLowerCase('sv-SE');
      const matches = query
        ? archiveEntries.filter(item => item.headline.toLocaleLowerCase('sv-SE').includes(query))
        : archiveEntries;
      if (!matches.length) {
        const empty = document.createElement('span');
        empty.textContent = 'Inga matchande rubriker.';
        archiveList.appendChild(empty);
        return;
      }
      matches.slice(0, ARCHIVE_VISIBLE_ITEMS).forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'archive-entry';
        const meta = document.createElement('small');
        meta.textContent = `${formatter.format(new Date(item.savedAt))} · ${item.id.replace(/-/g, ' ')}${item.id.endsWith('-alt') ? ' (alternativ)' : ''}`;
        const headline = document.createElement('strong');
        headline.textContent = item.headline || '(Ingen rubrik)';
        const visualWidth = archiveHeadlineWidth(item);
        if (visualWidth !== null) {
          headline.style.width = `${visualWidth}px`;
        }
        const deck = document.createElement('span');
        deck.textContent = item.deck;
        button.append(meta, headline, deck);
        button.addEventListener('click', () => restoreArchiveVersion(item));
        archiveList.appendChild(button);
      });
    }

    function initializeArchive() {
      persistArchive();
      archiveSearchToggle.addEventListener('click', () => {
        const opening = archiveSearch.hidden;
        archiveSearch.hidden = !opening;
        archiveSearchToggle.setAttribute('aria-expanded', String(opening));
        if (opening) archiveSearch.focus();
        else { archiveSearch.value = ''; renderArchive(); }
      });
      archiveSearch.addEventListener('input', renderArchive);
      archiveSearch.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          archiveSearchToggle.click();
          archiveSearchToggle.focus();
        }
      });
      archiveToggle.addEventListener('click', () => {
        archivePanel.hidden = !archivePanel.hidden;
        archiveToggle.setAttribute('aria-expanded', String(!archivePanel.hidden));
        if (!archivePanel.hidden) renderArchive();
      });
      headlineRecords.forEach((record, id) => {
        record.field.addEventListener('input', () => scheduleArchiveSave(id));
        record.deck.addEventListener('input', () => scheduleArchiveSave(id));
      });
    }

    // -------------------------------------------------------------------------
    // 7. Initiering
    // -------------------------------------------------------------------------

    function initialize() {
      BASE_FORMATS.forEach(buildFormat);
      headlineRecords.forEach(bindRecord);
      initializeArchive();

      elements.previewToggle.addEventListener('click', toggleMainPreview);
      elements.previewLabel.addEventListener('click', () => elements.previewToggle.click());
      elements.sideToggle.addEventListener('click', toggleSidePreview);
      elements.sidePreviewLabel.addEventListener('click', () => elements.sideToggle.click());

      bindImageEvents();
      updateCropPosition();
      updateZoom();
      updatePreview();

      window.addEventListener('resize', () => {
        recalculateAllHeadlines();
        requestAnimationFrame(updatePreview);
      });

      document.fonts.ready.then(() => {
        recalculateAllHeadlines();
        updatePreview();
      });
    }

    initialize();
  </script>
