<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rubrikgranskaren</title>
  <!-- Rubrikgranskaren: vitt R på röd botten. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='11' fill='%23E60000'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Arial,sans-serif' font-size='49' font-weight='900' fill='white'%3ER%3C/text%3E%3C/svg%3E">
  <style>
  /* Typsnitt: externa filer som behövs för korrekta radbrytningar. */
  @font-face {
    font-family: ABMonument;
    src: url('https://cdn.aftonbladet.se/fonts/ABMonumentGroteskHeadline/ABMonumentGroteskHeadline-Bold750.woff2') format('woff2');
    font-display: swap;
  }

  @font-face {
    font-family: ABMonumentRegular;
    src: url('https://cdn.aftonbladet.se/fonts/ABMonumentGrotesk/ABMonumentGrotesk-Regular.woff2') format('woff2');
    font-display: swap;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #fffec8;
    color: #000;
    font-family: ABMonument,sans-serif;
  }

  /* Huvudlayout: rubrikfält till vänster och puff till höger. */
  .layout {
    display: grid;
    grid-template-columns: 383px 375px;
    gap: 24px 20px;
    max-width: 822px;
    margin: 24px auto;
    padding: 0 22px;
    align-items: start;
  }

  .sidebar {
    grid-column: 1/-1;
    font-family: 'Courier New',monospace;
    color: #555;
  }

  /* När förhandsvisningen är stängd blir verktyget smalt och centrerat. */
  /* Låt högerspaltens rubrik vara synlig även när puffen är infälld. */
  .layout.preview-collapsed {
    grid-template-columns: 383px 375px;
  }

  /* Reglaget sitter på samma rad som puffens etikett. Av är standard. */
  .preview-control {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 4px 2px;
    font: 13px Arial,sans-serif;
    color: #555;
  }

  .preview-status {
    min-width: 16px;
  }

  .preview-toggle {
    width: 40px;
    height: 23px;
    padding: 3px;
    border: 0;
    border-radius: 999px;
    background: #a3a3a3;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    transition: background-color .15s ease;
  }

  .preview-toggle[aria-checked="true"] {
    background: #238a61;
    justify-content: flex-end;
  }

  .preview-toggle-knob {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #fff;
    display: block;
  }

  .preview-toggle:focus-visible {
    outline: 2px solid #555;
    outline-offset: 3px;
  }

  .preview[hidden] {
    display: none;
  }

  .sidebar .title {
    font-size: 32px;
    letter-spacing: .06em;
    line-height: 1.1;
  }

  .contact {
    font-size: 12px;
    font-style: italic;
    margin-top: 4px;
  }

  /* Lank till den korta manualfilmen, utan understrykning. */
  .contact .help-link {
    color: #555;
    text-decoration: none;
  }

  .contact .help-link:hover,
  .contact .help-link:focus-visible {
    text-decoration: none;
  }

  .contact a {
    color: #005bd1;
    text-decoration: none;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .label {
    font: 13px Arial,sans-serif;
    color: #555;
    margin: 0 0 4px 2px;
  }

  .box {
    width: 375px;
    background: #fff;
    padding: 0 4px;
  }

  .box.regular-box {
    width: 360px;
  }

  .deck-box {
    width: 340px;
    background: #fff;
    padding: 0 4px;
  }

  .box-gap {
    margin-bottom: 10px;
  }

  .deck-gap {
    margin-top: 10px;
  }

  textarea {
    width: 100%;
    font-family: ABMonument,sans-serif;
    font-weight: 750;
    line-height: 1;
    letter-spacing: -.02em;
    padding: 0;
    margin: 0;
    border: none;
    outline: none;
    resize: none;
    overflow: hidden;
    background: #fff;
    color: #000;
  }

  textarea.regular,textarea.large,textarea.xl {
    white-space: normal;
    word-break: normal;
    overflow-wrap: normal;
  }

  textarea.regular {
    font-size: 44px;
    height: 88px;
  }

  textarea.large {
    font-size: 54px;
  }

  textarea.large[data-lines="2"] {
    height: 108px;
  }

  textarea.large[data-lines="3"] {
    height: 162px;
  }

  textarea.xl {
    font-size: 74px;
  }

  textarea.xl[data-lines="2"] {
    height: 148px;
  }

  textarea.xl[data-lines="3"] {
    height: 222px;
  }

  .decktext {
    font-family: ABMonumentRegular,sans-serif;
    font-size: 16px;
    line-height: 1.2;
    height: 38.4px;
  }

  .decktext::placeholder {
    color: #aaa;
    font-style: italic;
    font-size: 14px;
  }

  /* Sticky: puffen syns när redaktören scrollar mellan rubrikfälten. */
  .preview-area {
    position: sticky;
    top: 24px;
    min-width: 0;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    font: 13px Arial,sans-serif;
    color: #555;
  }

  .preview-header select {
    padding: 7px;
    border: 1px solid #bbb;
    background: white;
    border-radius: 3px;
  }

  .dropzone {
    border: 2px dashed #999;
    background: #fffde6;
    padding: 14px;
    text-align: center;
    font: 14px Arial,sans-serif;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .empty-image.drag {
    background: #fff2a3;
  }

  .dropzone input {
    display: none;
  }

  /* Puffens bredd matchar det aktiva rubrikfaltets faktiska boxbredd. */
  .preview {
    background: #fff;
    width: 375px;
    max-width: 100%;
    overflow: hidden;
    position: relative;
  }

  .preview img {
    display: block;
    width: 100%;
    height: auto;
  }

  .preview img[hidden],.empty-image[hidden] {
    display: none;
  }

  /* Forhandsvisningens text ar endast till for att lasa.
     Muspekaren ska inte visa en textmarkor och texten ska inte
     kunna markeras eller ge intryck av att vara redigerbar. */
  .preview-copy {
    width: 100%;
    max-width: 100%;
    background: #fff;
    padding: 12px 4px 16px;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
    cursor: default;
  }

  .preview-title,.preview-deck {
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  .preview-title {
    font-family: ABMonument,sans-serif;
    font-weight: 750;
    letter-spacing: -.02em;
    line-height: 1;
    overflow-wrap: normal;
    white-space: pre-wrap;
  }

  .preview-deck {
    /* Samma effektiva textbredd som .deck-box: 340 - 4 - 4 = 332 px. */
    width: 332px;
    max-width: 100%;
    font-family: ABMonumentRegular,Arial,sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.2;
    margin-top: 10px;
    white-space: pre-wrap;
    overflow-wrap: normal;
  }

  .empty-image {
    cursor: pointer;
    text-align: center;
    padding: 12px;
    background: #eee;
    aspect-ratio: 1500/549;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px Arial,sans-serif;
    color: #aaa;
  }

  .remove-image {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.78);
    color: #fff;
    font: 24px Arial,sans-serif;
    cursor: pointer;
    z-index: 2;
  }

  .remove-image[hidden] {
    display: none;
  }

  .preview-note {
    font: 12px Arial,sans-serif;
    color: #666;
    margin-top: 10px;
    line-height: 1.4;
  }

  /* Ingen responsiv omflyttning: förhandsvisningen stannar alltid till höger. */

  /* Rubriketiketter fungerar som klickbara kontroller utan visuell förändring. */
  .clickable-heading {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    margin: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .clickable-heading:focus-visible { outline: 2px solid #555; outline-offset: 3px; }

  /* Ett diskret plus vid varje format öppnar ett extra rubrikförslag. */
  .format-heading {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* Storre klickyta (ca 40 x 44 px) utan att plus/minus flyttas.
     Negativa marginaler tar ut den extra paddingen, sa layouten
     och symbolens visuella placering blir desamma som tidigare. */
  .variant-button {
    padding: 12px 14px 12px 6px;
    margin: -12px -11px -12px -6px;
    border: 0;
    background: transparent;
    color: #555;
    font: 20px/1 Arial,sans-serif;
    cursor: pointer;
  }
  .variant-button:hover {
    color:#000;
  }
  .variant-button:focus-visible { outline:2px solid #555; outline-offset:2px; }
  /* Alternativet fälls ut mjukt, utan att fördröja redigeringen.
     Grid-rader ger en korrekt höjd även om rubriken ändras. */
  .alternative-block {
    display: grid;
    grid-template-rows: 0fr;
    margin-top: 0;
    transition: grid-template-rows 130ms ease-out, margin-top 130ms ease-out;
  }
  .alternative-block.is-open {
    grid-template-rows: 1fr;
    margin-top: 14px;
  }
  .alternative-block-inner {
    min-height: 0;
    overflow: hidden;
    visibility: hidden;
    transition: visibility 0s linear 130ms;
  }
  .alternative-block.is-open .alternative-block-inner {
    visibility: visible;
    transition-delay: 0s;
  }
  /* Bara etiketten Alternativ ligger på en diskret gul platta.
     Inga gula kanter på sidorna eller under rubrikfälten. */
  .alternative-block-inner {
    background: transparent;
    padding: 0;
    border: 0;
  }
  .alternative-block-inner > .label {
    background: #fff4b8;
    color: #555;
    width: 375px;
    max-width: 100%;
    padding: 6px 4px;
    margin: 0 0 8px;
  }
  /* Regular har en smalare rubrikruta (360 px). Plattan följer samma bredd. */
  .alternative-block-inner.regular-alternative > .label {
    width: 360px;
  }
  .alternative-block-inner .box,
  .alternative-block-inner .deck-box {
    max-width: 100%;
  }

  /* Respektera Chromes inställning för minskad rörelse. */
  @media (prefers-reduced-motion:reduce) {
    .alternative-block,
    .alternative-block-inner {
      transition:none;
    }
  }

  /* Extra sidopuff: 2/3 text och 1/3 bild, under ordinarie puff. */
  .side-preview {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    width: 375px;
    max-width: 100%;
    margin-top: 14px;
    background: #fff;
    overflow: hidden;
  }
  .side-preview[hidden] { display: none; }
  .side-preview-toggle-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font: 13px Arial, sans-serif; color: #555;
  }
  .side-preview-toggle-row[hidden] { display: none; }
  .side-preview-toggle-row .variant-button { margin: -12px -11px -12px -6px; }
  .side-title, .side-deck { user-select: none; pointer-events: none; cursor: default; }

  .side-copy { padding: 10px 6px; min-width: 0; }
  .side-title {
    font-family: ABMonument, sans-serif;
    font-weight: 750;
    letter-spacing: -.02em;
    line-height: 1;
    white-space: pre-wrap;
    overflow-wrap: normal;
  }
  .side-deck {
    font-family: ABMonumentRegular, Arial, sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.2;
    margin-top: 8px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .side-image-area {
    position: relative;
    min-height: 115px;
    background: #eee;
    overflow: hidden;
  }
  .side-image-area img {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    object-fit: cover;
    object-position: center;
  }
  .side-image-area img[hidden] { display: none; }
  .side-image-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font: 12px Arial, sans-serif;
    color: #999;
    text-align: center;
  }
  .side-image-placeholder[hidden] { display: none; }
  .side-crop-controls { display: flex; align-items: center; gap: 8px; margin-top: 7px; font: 12px Arial, sans-serif; color: #555; }
  .side-crop-controls[hidden] { display: none; }
  .side-crop-controls button { border: 1px solid #aaa; border-radius: 3px; background: #fff; color: #333; padding: 5px 9px; cursor: pointer; font: inherit; }
  .side-crop-controls button[aria-pressed="true"] { background: #333; color: white; border-color: #333; }
  .side-crop-controls button:focus-visible { outline: 2px solid #005bd1; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="layout preview-collapsed" id="layout">
  <aside class="sidebar">
   <div class="title">
    RUBRIKGRANSKARE
   </div>
   <div class="contact">
    Beta 2.2 ·
    <a class="help-link"
       href="https://drive.google.com/file/d/1SWDvGUG_xaz2xifz8poDpf90jYG_v-7D/view"
       target="_blank" rel="noopener noreferrer"
       title="Se demonstrationsvideon i en ny flik">ⓘ Nya funktioner</a>
    · Contact:
    <a href="mailto:joakim.ottosson@schibsted.com">Joakim Ottosson</a>
   </div>
  </aside>
  <main class="wrapper">
   <div>
    <div class="label">
     Regular · 2 rader
    </div>
    <div class="box regular-box box-gap">
     <textarea class="regular" id="regular-2"></textarea>
    </div>
    <div class="deck-box">
     <textarea class="decktext" id="deck-1" placeholder="nedryck"></textarea>
    </div>
   </div>
   <div>
    <div class="label">
     Large · 2 rader
    </div>
    <div class="box">
     <textarea class="large" data-lines="2" id="large-2"></textarea>
    </div>
    <div class="deck-box deck-gap">
     <textarea class="decktext" id="deck-2" placeholder="nedryck"></textarea>
    </div>
   </div>
   <div>
    <div class="label">
     Large · 3 rader
    </div>
    <div class="box">
     <textarea class="large" data-lines="3" id="large-3"></textarea>
    </div>
    <div class="deck-box deck-gap">
     <textarea class="decktext" id="deck-3" placeholder="nedryck"></textarea>
    </div>
   </div>
   <div>
    <div class="label">
     XL · 2 rader
    </div>
    <div class="box">
     <textarea class="xl" data-lines="2" id="xl-2"></textarea>
    </div>
    <div class="deck-box deck-gap">
     <textarea class="decktext" id="deck-4" placeholder="nedryck"></textarea>
    </div>
   </div>
   <div>
    <div class="label">
     XL · 3 rader
    </div>
    <div class="box">
     <textarea class="xl" data-lines="3" id="xl-3"></textarea>
    </div>
    <div class="deck-box deck-gap">
     <textarea class="decktext" id="deck-5" placeholder="nedryck"></textarea>
    </div>
   </div>
  </main>
  <section class="preview-area" id="preview-area">
   <div class="preview-control">
    <button type="button" class="clickable-heading" id="preview-label" aria-controls="preview" title="Slå på eller av förhandsvisning">Puff · Förhandsvisning</button>
    <span class="preview-status" id="preview-status" aria-hidden="true">Av</span>
    <button type="button" class="preview-toggle" id="toggle-preview"
            role="switch" aria-label="Förhandsvisning" aria-checked="false"
            aria-controls="preview" title="Slå på eller av förhandsvisning">
     <span class="preview-toggle-knob" aria-hidden="true"></span>
    </button>
   </div>
   <div class="preview" id="preview" hidden>
    <button aria-label="Ta bort bilden" class="remove-image" hidden="" id="remove-image" title="Ta bort bilden" type="button">
     ×
    </button>
    <label class="empty-image" for="image-file" id="empty-image">
     Klicka eller dra in bild
    </label>
    <input accept="image/*" hidden="" id="image-file" type="file"/>
    <img alt="Vald puffbild" hidden="" id="preview-image"/>
    <div class="preview-copy">
     <div class="preview-title" id="preview-title"></div>
     <div class="preview-deck" id="preview-deck"></div>
    </div>
   </div>
   <div class="side-preview-toggle-row" id="side-preview-toggle-row" hidden>
     <button type="button" class="clickable-heading" id="side-preview-label" aria-controls="side-preview" title="Visa eller dölj sidopuff">Sidopuff</button>
     <button type="button" class="variant-button" id="toggle-side-preview"
       aria-expanded="false" aria-controls="side-preview" aria-label="Visa sidopuff"
       title="Visa sidopuff">+</button>
   </div>
   <div class="side-preview" id="side-preview" hidden aria-label="Sidopuff med bild till höger">
     <div class="side-copy">
       <div class="side-title" id="side-title"></div>
       <div class="side-deck" id="side-deck"></div>
     </div>
     <div class="side-image-area">
       <div class="side-image-placeholder" id="side-image-placeholder">Bildutsnitt</div>
       <img id="side-image" alt="Beskuret utsnitt av vald bild" hidden>
     </div>
   </div>
   <div class="side-crop-controls" id="side-crop-controls" hidden aria-label="Välj bildutsnitt för sidopuffen">
     <span>Bildutsnitt:</span>
     <button type="button" data-crop="left" aria-pressed="false" title="Visa vänstra delen">Vänster</button>
     <button type="button" data-crop="center" aria-pressed="true" title="Visa mitten">Mitten</button>
     <button type="button" data-crop="right" aria-pressed="false" title="Visa högra delen">Höger</button>
   </div>
  </section>
 </div>
<script>
// ============================================================
// 1. INSTÄLLNINGAR FÖR RUBRIKFÄLTEN
// Ändra maxstorleken här om ett rubrikformat ska bli större
// eller mindre. Minsta tillåtna storlek är 16 pixlar.
// ============================================================
const headlineFormats = [
  { id: 'regular-2', maxSize: 44 },
  { id: 'large-2',   maxSize: 54 },
  { id: 'large-3',   maxSize: 54 },
  { id: 'xl-2',      maxSize: 74 },
  { id: 'xl-3',      maxSize: 74 }
];

const headlineIds = headlineFormats.map(format => format.id);
const deckFields = [1, 2, 3, 4, 5].map(number =>
  document.getElementById(`deck-${number}`)
);

// ============================================================
// EXTRA RUBRIKFÖRSLAG
// Varje format kan visa ett extra rubrikfält och ett eget nedryck.
// Alternativet behåller sin text när det fälls ihop. När man
// stänger det aktiva alternativet återgår puffen till originalet.
// ============================================================
headlineFormats.slice().forEach((format, index) => {
  const original = document.getElementById(format.id);
  const group = original.parentElement.parentElement;
  const heading = group.querySelector('.label');
  const alternativeId = format.id + '-alt';
  const alternativeDeckId = 'deck-' + (index + 1) + '-alt';

  heading.classList.add('format-heading');
  const headingText = heading.textContent.trim();
  heading.textContent = '';
  const headingButton = document.createElement('button');
  headingButton.type = 'button';
  headingButton.className = 'clickable-heading';
  headingButton.textContent = headingText;
  headingButton.title = 'Visa eller dölj alternativ';
  heading.appendChild(headingButton);
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'variant-button';
  button.textContent = '+';
  button.title = 'Visa ett extra rubrikförslag';
  button.setAttribute('aria-label', 'Visa alternativ för ' + heading.textContent.trim());
  button.setAttribute('aria-expanded', 'false');
  button.setAttribute('aria-controls', alternativeId + '-section');
  heading.appendChild(button);
  headingButton.addEventListener('click', () => button.click());

  const section = document.createElement('div');
  section.className = 'alternative-block';
  section.id = alternativeId + '-section';
  section.setAttribute('aria-hidden', 'true');
  section.inert = true;

  // Allt innehåll ligger i ett inre element så höjden kan animeras.
  const sectionInner = document.createElement('div');
  sectionInner.className = 'alternative-block-inner';
  if (original.classList.contains('regular')) sectionInner.classList.add('regular-alternative');
  section.appendChild(sectionInner);

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'Alternativ';
  sectionInner.appendChild(label);

  const headlineBox = original.parentElement.cloneNode(false);
  const alternative = original.cloneNode(false);
  alternative.id = alternativeId;
  alternative.value = '';
  alternative.removeAttribute('title');
  headlineBox.appendChild(alternative);
  sectionInner.appendChild(headlineBox);

  const originalDeck = deckFields[index];
  const deckBox = originalDeck.parentElement.cloneNode(false);
  const alternativeDeck = originalDeck.cloneNode(false);
  alternativeDeck.id = alternativeDeckId;
  alternativeDeck.value = '';
  deckBox.appendChild(alternativeDeck);
  sectionInner.appendChild(deckBox);
  group.appendChild(section);

  // Lägg till alternativet i samma system för storleksanpassning
  // och automatisk förhandsvisning som originalfälten.
  headlineFormats.push({ id: alternativeId, maxSize: format.maxSize });
  headlineIds.push(alternativeId);
  deckFields.push(alternativeDeck);

  button.addEventListener('click', () => {
    const opening = !section.classList.contains('is-open');

    // Om alternativet är aktivt återgår vi till originalet vid stängning.
    if (!opening && activeSource === alternativeId) original.focus();

    section.classList.toggle('is-open', opening);
    section.inert = !opening;
    section.setAttribute('aria-hidden', String(!opening));
    button.textContent = opening ? '−' : '+';
    button.title = opening ? 'Fäll ihop alternativet' : 'Visa ett extra rubrikförslag';
    button.setAttribute('aria-expanded', String(opening));
    button.setAttribute('aria-label', (opening ? 'Dölj' : 'Visa') + ' alternativ för ' + headingText);

    if (opening) {
      // Mät när alternativet blivit synligt. Texten finns kvar vid återöppning.
      fit(alternative, { min: 16, max: format.maxSize });
      alternative.focus();
    }
  });
});

// ============================================================
// 2. MÄT HUR MÅNGA RADER EN RUBRIK TAR
// Ett osynligt element mäter texten med samma typsnitt som
// rubrikfältet. Marginalen 16 px kommer från det fungerande
// radtest 2. Ändra den inte utan att testa alla fem format.
// ============================================================
const lineMirror = document.createElement('div');
Object.assign(lineMirror.style, {
  position: 'absolute',
  visibility: 'hidden',
  pointerEvents: 'none',
  left: '-10000px',
  top: '0',
  padding: '0',
  margin: '0',
  border: '0',
  whiteSpace: 'pre-wrap',
  overflowWrap: 'normal',
  wordBreak: 'normal'
});
document.body.appendChild(lineMirror);

function measuredLines(field, fontSize) {
  const style = getComputedStyle(field);

  Object.assign(lineMirror.style, {
    width: Math.max(1, field.clientWidth - 16) + 'px',
    fontFamily: style.fontFamily,
    fontWeight: style.fontWeight,
    fontStyle: style.fontStyle,
    fontSize: fontSize + 'px',
    lineHeight: style.lineHeight === 'normal' ? 'normal' : fontSize + 'px',
    letterSpacing: style.letterSpacing,
    textTransform: style.textTransform
  });

  // Nollbreddstecknet gör att en avslutande radbrytning räknas.
  lineMirror.textContent = (field.value || '') + '\u200b';
  return Math.max(1, Math.ceil((lineMirror.getBoundingClientRect().height - 0.5) / fontSize));
}

// ============================================================
// 3. ANPASSA RUBRIKENS STORLEK
// Binärsökning hittar största möjliga storlek som ryms inom
// två respektive tre rader. Ingen text klipps bort.
// ============================================================
function fit(field, { min = 16, max, precision = 0.25 }) {
  const allowedLines = Number(field.dataset.lines) || 2;
  if (!field.clientWidth) return;

  let lower = min;
  let upper = max;

  if (measuredLines(field, max) <= allowedLines) {
    field.style.fontSize = max + 'px';
    return;
  }

  while (upper - lower > precision) {
    const middle = (lower + upper) / 2;
    if (measuredLines(field, middle) <= allowedLines) {
      lower = middle;
    } else {
      upper = middle;
    }
  }

  field.style.fontSize = Math.max(min, lower - 0.5) + 'px';
  field.title = measuredLines(field, lower) > allowedLines
    ? 'Texten är för lång för ' + allowedLines + ' rader'
    : '';
}

// Koppla omräkning till skrivning, inklistring och fönsterstorlek.
function attachHeadline(field, maxSize) {
  const recalculate = () => fit(field, { min: 16, max: maxSize });

  field.addEventListener('input', recalculate);

  // INKLISTRING AV RUBRIKER
  // Webbsidor kan lägga in radbrytningar och hårda mellanslag i kopierad text.
  // Gör bara den inklistrade delen till löpande text. Text som redan finns
  // i fältet och manuella radbrytningar som redaktören skriver lämnas orörda.
  field.addEventListener('paste', event => {
    const clipboardText = event.clipboardData?.getData('text/plain');
    if (!clipboardText) return; // Låt Chrome hantera t.ex. bilddata som vanligt.

    event.preventDefault();
    const normalized = clipboardText
      .replace(/[\u200B\u2060\uFEFF]/g, '') // Osynliga formateringstecken.
      .replace(/\s+/gu, ' ')                // Radbrytningar och extra blanksteg.
      .trim();

    const start = field.selectionStart;
    const end = field.selectionEnd;
    const before = field.value.slice(0, start);
    const after = field.value.slice(end);
    const prefix = /^\s/.test(clipboardText) && before && !/\s$/.test(before) ? ' ' : '';
    const suffix = /\s$/.test(clipboardText) && after && !/^\s/.test(after) ? ' ' : '';
    const cleanedText = prefix + normalized + suffix;

    // Låt Chrome utföra själva textinfogningen. Till skillnad från
    // setRangeText kan insertText ingå i Chromes vanliga ångrahistorik,
    // så att Cmd+Z kan återställa en inklistring (även över markerad text).
    // execCommand är ett äldre API, därför finns en reservmetod nedan.
    const inserted = document.execCommand('insertText', false, cleanedText);
    if (!inserted) {
      // Reservmetod om Chrome någon gång slutar stödja insertText.
      // Inklistringen fungerar fortfarande, men Cmd+Z kan då saknas.
      field.setRangeText(cleanedText, start, end, 'end');
      field.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Säkerställ att radmätning och förhandsvisning hinner uppdateras.
    requestAnimationFrame(() => {
      recalculate();
      if (activeSource === field.id) updatePreview();
    });
  });

  window.addEventListener('resize', recalculate);
  recalculate();
}

headlineFormats.forEach(format => {
  const field = document.getElementById(format.id);
  if (field) attachHeadline(field, format.maxSize);
});

// ============================================================
// 4. SLÅ PÅ ELLER AV FÖRHANDSVISNINGEN
// Puffen är avstängd när sidan öppnas. Reglaget visar eller döljer
// den utan att rubriker, nedryck eller bild raderas.
// ============================================================
const layout = document.getElementById('layout');
const previewArea = document.getElementById('preview');
const togglePreviewButton = document.getElementById('toggle-preview');
const previewStatus = document.getElementById('preview-status');
const sidePreview = document.getElementById('side-preview');
const sideToggleRow = document.getElementById('side-preview-toggle-row');
const sideToggleButton = document.getElementById('toggle-side-preview');
let sideExpanded = false;
sideToggleButton.addEventListener('click', () => {
  sideExpanded = !sideExpanded;
  sidePreview.hidden = previewArea.hidden || !sideExpanded;
  document.getElementById('side-crop-controls').hidden = sidePreview.hidden;
  sideToggleButton.textContent = sideExpanded ? '−' : '+';
  sideToggleButton.setAttribute('aria-expanded', String(sideExpanded));
  sideToggleButton.setAttribute('aria-label', sideExpanded ? 'Dölj sidopuff' : 'Visa sidopuff');
  sideToggleButton.title = sideExpanded ? 'Dölj sidopuff' : 'Visa sidopuff';
  if (!sidePreview.hidden) requestAnimationFrame(updatePreview);
});

togglePreviewButton.addEventListener('click', () => {
  const shouldShow = previewArea.hidden;
  previewArea.hidden = !shouldShow;
  sideToggleRow.hidden = !shouldShow;
  sidePreview.hidden = !shouldShow || !sideExpanded;
  document.getElementById('side-crop-controls').hidden = sidePreview.hidden;
  layout.classList.toggle('preview-collapsed', !shouldShow);
  togglePreviewButton.setAttribute('aria-checked', String(shouldShow));
  previewStatus.textContent = shouldShow ? 'På' : 'Av';

  // Den dolda puffen har bredd 0. Beräkna textstorleken först
  // när puffen visas igen, så att radbrytningen blir korrekt.
  if (shouldShow) requestAnimationFrame(updatePreview);
});

// ============================================================
// 5. FÖRHANDSVISNING I REALTID
// Det senast aktiva rubrik- eller nedrycksfältet bestämmer
// vilken av de fem puffarna som visas. Ingen väljare behövs.
// ============================================================
let activeSource = 'large-2';
const previewTitle = document.getElementById('preview-title');
const previewDeck = document.getElementById('preview-deck');
const sideTitle = document.getElementById('side-title');
const sideDeck = document.getElementById('side-deck');

// Anpassa sidopuffens rubrik till den faktiska textkolumnen.
// Separat från huvudrubrikens 1:1-förhandsvisning.
const sideMeasure = document.createElement('div');
Object.assign(sideMeasure.style, {
  position: 'absolute', visibility: 'hidden', pointerEvents: 'none',
  left: '-10000px', top: '0', padding: '0', border: '0', margin: '0',
  whiteSpace: 'pre-wrap', overflowWrap: 'normal', wordBreak: 'normal'
});
document.body.appendChild(sideMeasure);

function fitSideTitle() {
  if (sidePreview.hidden || !sideTitle.clientWidth) return;
  const style = getComputedStyle(sideTitle);
  const text = sideTitle.textContent || '';
  Object.assign(sideMeasure.style, {
    width: sideTitle.clientWidth + 'px',
    fontFamily: style.fontFamily, fontWeight: style.fontWeight,
    fontStyle: style.fontStyle, letterSpacing: style.letterSpacing,
    textTransform: style.textTransform
  });
  sideMeasure.textContent = text + '\u200b';
  // Kontrollera verkligt antal renderade rader med samma font och textbredd.
  const range = document.createRange();
  range.selectNodeContents(sideMeasure);
  const lineCount = size => {
    sideMeasure.style.fontSize = size + 'px';
    sideMeasure.style.lineHeight = size + 'px';
    const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
    const tops = [];
    for (const rect of rects) {
      if (!tops.some(y => Math.abs(y - rect.top) < 1)) tops.push(rect.top);
    }
    return tops.length;
  };
  let low = 8, high = 54; // Sidopuffen får växa för korta rubriker; max två rader.
  if (lineCount(high) <= 2) low = high;
  else if (lineCount(low) <= 2) {
    for (let i = 0; i < 14; i++) {
      const mid = (low + high) / 2;
      if (lineCount(mid) <= 2) low = mid;
      else high = mid;
    }
  }
  // En liten marginal mot skillnader i subpixelavrundning.
  let size = Math.max(8, low - 0.25);
  sideTitle.style.fontSize = size + 'px';
  // Verifiera även den synliga rubrikens faktiska radantal.
  const actualRange = document.createRange();
  actualRange.selectNodeContents(sideTitle);
  const actualLines = () => {
    const tops = [];
    for (const rect of actualRange.getClientRects()) {
      if (rect.width > 0 && !tops.some(y => Math.abs(y - rect.top) < 1)) tops.push(rect.top);
    }
    return tops.length;
  };
  while (actualLines() > 2 && size > 8) {
    size = Math.max(8, size - 0.25);
    sideTitle.style.fontSize = size + 'px';
  }
  // Manuella radbrytningar kan tvinga fram fler än två rader.
  sideTitle.title = actualLines() > 2 ? 'Manuella radbrytningar ger fler än två rader' : '';
}

function updatePreview() {
  const headline = document.getElementById(activeSource);
  const deck = deckFields[headlineIds.indexOf(activeSource)];

  previewTitle.textContent = headline.value;
  previewDeck.textContent = deck.value;
  sideTitle.textContent = headline.value;
  sideDeck.textContent = deck.value;

  // Ingen skalning: identisk boxbredd och fontstorlek som redigeringsfaltet.
  // Regular (360 px) respektive Large/XL (375 px).
  const preview = document.getElementById('preview');
  preview.style.width = headline.parentElement.getBoundingClientRect().width + 'px';
  const sourceStyle = getComputedStyle(headline);
  previewTitle.style.fontSize = sourceStyle.fontSize;
  previewTitle.style.fontFamily = sourceStyle.fontFamily;
  previewTitle.style.fontWeight = sourceStyle.fontWeight;
  previewTitle.style.letterSpacing = sourceStyle.letterSpacing;
  previewTitle.style.lineHeight = sourceStyle.lineHeight;
  sidePreview.style.width = preview.style.width;
  // Sidopuffen mäts separat, mot sin egen textkolumn (2/3 av bredden).
  fitSideTitle();
}

headlineIds.forEach(id => {
  const field = document.getElementById(id);
  field.addEventListener('focus', () => {
    activeSource = id;
    updatePreview();
  });
  field.addEventListener('input', () => {
    activeSource = id;
    requestAnimationFrame(updatePreview);
  });
});

deckFields.forEach((field, index) => {
  field.addEventListener('focus', () => {
    activeSource = headlineIds[index];
    updatePreview();
  });
  field.addEventListener('input', updatePreview);
});

window.addEventListener('resize', () => requestAnimationFrame(updatePreview));

// Typsnitt kan laddas efter att sidan visas. Mät då om allt.
document.fonts.ready.then(() => {
  headlineFormats.forEach(format => {
    fit(document.getElementById(format.id), { min: 16, max: format.maxSize });
  });
  updatePreview();
});
updatePreview();

// ============================================================
// 6. BILDHANTERING
// Bilden finns bara lokalt i webbläsaren. Den kan väljas,
// dras in, klistras in eller tas bort med krysset.
// ============================================================
const fileInput = document.getElementById('image-file');
const previewImage = document.getElementById('preview-image');
const sideImage = document.getElementById('side-image');
// Beskärning påverkar enbart sidopuffen, inte huvudbilden.
const cropControls = document.getElementById('side-crop-controls');
cropControls.querySelectorAll('button[data-crop]').forEach(button => {
  button.addEventListener('click', () => {
    const position = { left: 'left center', center: 'center center', right: 'right center' }[button.dataset.crop];
    sideImage.style.objectPosition = position;
    cropControls.querySelectorAll('button[data-crop]').forEach(item => {
      item.setAttribute('aria-pressed', String(item === button));
    });
  });
});
const sideImagePlaceholder = document.getElementById('side-image-placeholder');
const emptyImage = document.getElementById('empty-image');
const removeButton = document.getElementById('remove-image');
const dropArea = document.querySelector('.preview-area');
let objectURL = null;

function removeImage() {
  if (objectURL) URL.revokeObjectURL(objectURL);
  objectURL = null;
  previewImage.removeAttribute('src');
  sideImage.removeAttribute('src');
  sideImage.hidden = true;
  sideImagePlaceholder.hidden = false;
  previewImage.hidden = true;
  emptyImage.hidden = false;
  removeButton.hidden = true;
  fileInput.value = '';
}

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (objectURL) URL.revokeObjectURL(objectURL);

  objectURL = URL.createObjectURL(file);
  previewImage.onload = () => {
    previewImage.hidden = false;
    sideImage.hidden = false;
    sideImagePlaceholder.hidden = true;
    emptyImage.hidden = true;
    removeButton.hidden = false;
  };
  previewImage.onerror = () => {
    previewImage.hidden = true;
    sideImage.hidden = true;
    sideImagePlaceholder.hidden = false;
    emptyImage.hidden = false;
    removeButton.hidden = true;
  };
  sideImage.src = objectURL;
  previewImage.src = objectURL;
}

removeButton.addEventListener('click', removeImage);
fileInput.addEventListener('change', () => loadImage(fileInput.files[0]));

['dragenter', 'dragover'].forEach(eventName => {
  dropArea.addEventListener(eventName, event => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'copy';
    emptyImage.classList.add('drag');
  });
});

dropArea.addEventListener('dragleave', event => {
  if (!dropArea.contains(event.relatedTarget)) {
    emptyImage.classList.remove('drag');
  }
});

dropArea.addEventListener('drop', event => {
  event.preventDefault();
  emptyImage.classList.remove('drag');
  const image = Array.from(event.dataTransfer.files).find(file =>
    file.type.startsWith('image/')
  );
  loadImage(image);
});

// Förhindra att Chrome öppnar den släppta bilden som en ny sida.
window.addEventListener('dragover', event => event.preventDefault());
window.addEventListener('drop', event => event.preventDefault());

// Även inklistrade bilder från urklippet ska fungera.
document.addEventListener('paste', event => {
  const image = Array.from(event.clipboardData?.files || []).find(file =>
    file.type.startsWith('image/')
  );
  if (image) loadImage(image);
});
// Rubriketiketterna har samma funktion som respektive reglage.
document.getElementById('preview-label').addEventListener('click', () =>
  document.getElementById('toggle-preview').click());
document.getElementById('side-preview-label').addEventListener('click', () =>
  document.getElementById('toggle-side-preview').click());
</script>
